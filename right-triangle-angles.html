    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --blue: #2563eb;
      --green: #059669;
      --red: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    .note {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    canvas {
      display: block;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: grab;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fafafa;
    }
    .label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .value, .angle-input {
      font-size: 20px;
      font-weight: bold;
      font-family: Menlo, Consolas, monospace;
    }
    .angle-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>直角三角形 ABC</h1>
    <p class="note">AB 會固定為水平線，B 角固定為 90°。你可以拖動 A 或 C 改變邊長；∠A 可以直接輸入，∠C 會自動更新，而整個三角形不會再傾斜亂轉。</p>

    <div class="panel">
      <canvas id="canvas" width="900" height="520" aria-label="可拖動的直角三角形畫布"></canvas>

      <div class="info-grid">
        <div class="card"><div class="label">AB（1-20）</div><div class="value" id="len-ab">0</div></div>
        <div class="card"><div class="label">BC（同單位）</div><div class="value" id="len-bc">0</div></div>
        <div class="card"><div class="label">AC（同單位）</div><div class="value" id="len-ac">0</div></div>
        <div class="card">
          <div class="label">∠A（可輸入）</div>
          <input id="angle-a-input" class="angle-input" type="number" min="1" max="89" step="0.1" value="42.5" />
          <div class="hint">可輸入 1° 至 89°</div>
        </div>
        <div class="card"><div class="label">∠B（固定）</div><div class="value" id="ang-b">90.0°</div></div>
        <div class="card"><div class="label">∠C（自動）</div><div class="value" id="ang-c">0°</div></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const inputA = document.getElementById('angle-a-input');
    const radius = 10;

    const B = { x: 500, y: 380 };
    const A = { x: 220, y: 380 };
    const C = { x: 500, y: 120 };

    let dragging = null;

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function formatNum(n) {
      return n.toFixed(1);
    }

    function formatDeg(n) {
      return n.toFixed(1) + '°';
    }

    function pxToABUnits(px) {
      return px / 20;
    }

    function abUnitsToPx(units) {
      return units * 20;
    }

    function clampAngleA(v) {
      if (Number.isNaN(v)) return 45;
      return Math.min(89, Math.max(1, v));
    }

    function clampABLength(len) {
      return Math.min(abUnitsToPx(20), Math.max(abUnitsToPx(1), len));
    }

    function clampBCLength(len) {
      return Math.min(360, Math.max(abUnitsToPx(1), len));
    }

    function pointHit(p, x, y) {
      return Math.hypot(p.x - x, p.y - y) <= radius + 4;
    }

    function drawPoint(p, label, color) {
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 18px Arial';
      ctx.fillText(label, p.x + 12, p.y - 12);
    }

    function drawAngleArc(vertex, p1, p2, r, color) {
      const a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
      const a2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
      let diff = a2 - a1;
      while (diff <= -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.arc(vertex.x, vertex.y, r, a1, a1 + diff, diff < 0);
      ctx.stroke();
    }

    function drawLengthLabel(text, x, y) {
      ctx.font = '14px Menlo, Consolas, monospace';
      const padX = 8;
      const width = ctx.measureText(text).width + padX * 2;
      const height = 24;
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      ctx.strokeStyle = '#d1d5db';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x - width / 2, y - height / 2, width, height, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111827';
      ctx.fillText(text, x - width / 2 + padX, y + 5);
    }

    function setFromAB(angleA, ab) {
      const bc = ab * Math.tan(angleA * Math.PI / 180);
      A.x = B.x - clampABLength(ab);
      A.y = B.y;
      C.x = B.x;
      C.y = B.y - clampBCLength(bc);
    }

    function setFromBC(angleA, bc) {
      const ab = bc / Math.tan(angleA * Math.PI / 180);
      A.x = B.x - clampABLength(ab);
      A.y = B.y;
      C.x = B.x;
      C.y = B.y - clampBCLength(bc);
    }

    function updateReadings() {
      const AB = dist(A, B);
      const BC = dist(B, C);
      const AC = dist(A, C);
      const angleA = Math.atan2(BC, AB) * 180 / Math.PI;
      const angleC = 90 - angleA;

      document.getElementById('len-ab').textContent = formatNum(pxToABUnits(AB));
      document.getElementById('len-bc').textContent = formatNum(pxToABUnits(BC));
      document.getElementById('len-ac').textContent = formatNum(pxToABUnits(AC));
      document.getElementById('ang-b').textContent = '90.0°';
      document.getElementById('ang-c').textContent = formatDeg(angleC);

      if (document.activeElement !== inputA) {
        inputA.value = formatNum(angleA);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#111827';
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.lineTo(C.x, C.y);
      ctx.closePath();
      ctx.stroke();

      drawAngleArc(A, B, C, 26, '#2563eb');
      drawAngleArc(B, A, C, 22, '#059669');
      drawAngleArc(C, A, B, 22, '#dc2626');

      drawPoint(A, 'A', '#2563eb');
      drawPoint(B, 'B', '#059669');
      drawPoint(C, 'C', '#dc2626');

      drawLengthLabel('AB = ' + formatNum(pxToABUnits(dist(A, B))), (A.x + B.x) / 2, A.y - 18);
      drawLengthLabel('BC = ' + formatNum(pxToABUnits(dist(B, C))), B.x + 48, (B.y + C.y) / 2);
      drawLengthLabel('AC = ' + formatNum(pxToABUnits(dist(A, C))), (A.x + C.x) / 2 - 12, (A.y + C.y) / 2 - 10);

      updateReadings();
    }

    inputA.addEventListener('input', () => {
      const angleA = clampAngleA(parseFloat(inputA.value));
      const ab = dist(A, B);
      inputA.value = angleA;
      setFromAB(angleA, ab);
      draw();
    });

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      if (pointHit(A, x, y)) dragging = 'A';
      else if (pointHit(C, x, y)) dragging = 'C';
      else if (pointHit(B, x, y)) dragging = 'B';
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      const angleA = clampAngleA(parseFloat(inputA.value));

      if (dragging === 'A') {
        const ab = clampABLength(B.x - x);
        setFromAB(angleA, ab);
      } else if (dragging === 'C') {
        const bc = clampBCLength(B.y - y);
        setFromBC(angleA, bc);
      } else if (dragging === 'B') {
        const nextBx = Math.max(260, Math.min(canvas.width - 120, x));
        const nextBy = Math.max(180, Math.min(canvas.height - 80, y));
        const ab = dist(A, B);
        const bc = dist(B, C);
        B.x = nextBx;
        B.y = nextBy;
        A.x = B.x - ab;
        A.y = B.y;
        C.x = B.x;
        C.y = B.y - bc;
      }
      draw();
    });

    ['mouseup', 'mouseleave'].forEach(evt => {
      canvas.addEventListener(evt, () => dragging = null);
    });

    setFromAB(clampAngleA(parseFloat(inputA.value)), dist(A, B));
    draw();
  </script>
</body>
</html>
